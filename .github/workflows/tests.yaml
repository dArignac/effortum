name: Tests CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true

      - name: Install pnpm
        run: |
          npm install --global corepack@latest
          corepack enable pnpm

      - name: Install dependencies
        run: |
          pnpm install

      - name: Run tests
        run: |
          pnpm test

      - name: Install Playwright
        run: |
          pnpm exec playwright install

      - name: Tests that require the resources defined above to run
        run: |
          pnpm test:e2e
